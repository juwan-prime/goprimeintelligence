<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Montserrat:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .cover {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 48px 24px 80px;
    position: relative;
    background: #000;
  }

  .cover-logo { margin-bottom: 40px; }
  .cover-logo img { height: 64px; width: auto; object-fit: contain; }

  .video-block {
    width: 100%;
    max-width: 960px;
    position: relative;
    aspect-ratio: 16 / 9;
    background: #0a0a0a;
    border: 1px solid rgba(201,168,118,0.12);
    overflow: hidden;
    margin-bottom: 44px;
  }

  .video-block iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .cover-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    font-weight: 400;
    font-style: italic;
    color: rgba(255,255,255,0.4);
    text-align: center;
    max-width: 620px;
    line-height: 1.55;
    margin-bottom: 48px;
    letter-spacing: 0.02em;
  }

  .cover-tagline strong {
    color: rgba(201,168,118,0.8);
    font-style: normal;
    font-weight: 600;
  }

  .cover-cta-primary {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }

  .btn-call {
    background: #C9A876;
    color: #000;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 18px 52px;
    text-decoration: none;
    display: inline-block;
    transition: background 0.2s;
  }
  .btn-call:hover { background: #D4B98A; }

  .btn-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 500;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.12em;
    text-decoration: none;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 40px;
  }

  .divider-line { flex: 1; height: 1px; background: rgba(201,168,118,0.12); }

  .divider-text {
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.18);
  }

  .secondary-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }

  .btn-secondary {
    border: 1px solid rgba(201,168,118,0.25);
    color: rgba(201,168,118,0.7);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 13px 32px;
    text-decoration: none;
    display: inline-block;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .btn-secondary:hover {
    border-color: #C9A876;
    color: #fff;
    background: rgba(201,168,118,0.06);
  }

  .cover-footer { text-align: center; }
  .cover-footer p { font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.1); }

  @media (max-width: 600px) {
    .cover { padding: 36px 16px 72px; }
    .cover-logo img { height: 48px; }
    .cover-tagline { font-size: clamp(1rem, 4.5vw, 1.3rem); margin-bottom: 36px; }
    .btn-call { padding: 16px 32px; font-size: 0.68rem; width: 100%; max-width: 320px; text-align: center; }
    .secondary-btns { flex-direction: column; align-items: center; }
    .btn-secondary { width: 100%; max-width: 320px; text-align: center; }
    .video-block { margin-bottom: 36px; }
    .divider { max-width: 280px; }
  }
</style>

<div class="cover">

  <!-- VIDEO BLOCK -->

      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>

  <!-- TAGLINE -->
  <p class="cover-tagline">

    <strong>Aria's handling my backend.</strong>
  </p>

  <!-- PRIMARY CTA -->
  <div class="cover-cta-primary">
    <a href="tel:5718372665" class="btn-call">📞 Call &amp; Meet Aria Now</a>
    <a href="tel:5718372665" class="btn-number">(571) 837-2665</a>
  </div>

  <!-- DIVIDER -->
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">Explore</span>
    <div class="divider-line"></div>
  </div>

  <!-- SECONDARY BUTTONS -->
  <div class="secondary-btns">
    <a href="aria.html" class="btn-secondary">Meet Aria →</a>
    <a href="pricing.html" class="btn-secondary">View Pricing →</a>
  </div>

  <!-- FOOTER -->
  <div class="cover-footer">
    <p>© 2026 PrimeView Media — Prime Intelligence CRM</p>
  </div>

</div>
